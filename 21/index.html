<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Astro</title>
        <meta content="" name="description">
        <meta content="" name="keywords">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="telephone=no" name="format-detection">
        <meta name="HandheldFriendly" content="true">
        <meta name="theme-color" content="#ffffff">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=block" rel="stylesheet">
        <link href="static/css/main.min.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>
        <!-- ------------------------------ TEMPLATE DEFAULT -------------------------------->
        <div class="w-root">
            <div class="w-page">
                <!-- ---------------  Top part page ----------------->
                <!-- begin header-->
                <header class="c-header">
                    <div class="c-header__inner">
                        <div class="c-header__cell">
                            <!-- begin logo-->
                            <a class="c-logo" href="#">
                                <img src="static/img/general/logo.svg" alt="Astro" width="90" height="20">
                            </a>
                            <!-- end logo-->
                        </div>
                        <div class="c-header__cell">
                            <!-- begin profile-label-->
                            <div class="c-profile-label">
                                <!-- begin avatar--><span class="c-avatar">n</span>
                                <!-- end avatar-->
                                <div class="c-profile-label__text">name@gmail.com</div>
                            </div>
                            <!-- end profile-label-->
                        </div>
                    </div>
                </header>
                <!-- end header-->
                <!-- ---------------  Content part page ----------------->
                <div class="w-page__content">
                    <!-- begin container-->
                    <main class="c-container">
                        <div class="w-centered w-column-gap-md">
                            <!-- begin rounded-box-->
                            <div class="c-rounded-box c-rounded-box--xl">
                                <!-- begin anim-gift-->
                                <div class="c-anim-gift">
                                    <div class="c-anim-gift__shadow"></div>
                                    <img class="c-anim-gift__img" src="static/img/general/gift.webp" alt="" width="444" height="444" />
                                </div>
                                <!-- end anim-gift-->
                            </div>
                            <!-- end rounded-box-->
                            <!-- begin title-->
                            <h1 class="c-title u-text-center">You get an exclusive one-time promo code <span class="u-text-highlight">for a 93% discount</span></h1>
                            <!-- end title-->
                            <!-- begin code-box-->
                            <div class="c-code-box">SOUL93
                            </div>
                            <!-- end code-box-->
                            <button class="c-btn" type="button">Continue
                            </button>
                        </div>
                    </main>
                    <!-- end container-->
                </div>
            </div>
        </div>
        <!-- --------------- Outside part page ----------------->
        <!-- Including js files-->


        <script src="static/js/separate-js/jquery-3.7.1.min.js"></script>
        <script src="static/js/separate-js/bootstrap.bundle.min.js"></script>
        <script src="static/js/separate-js/main.js"></script>
        <script src="static/js/separate-js/animations.js"></script>
    </body>

</html>
