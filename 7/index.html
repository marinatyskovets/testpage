<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Astro</title>
        <meta content="" name="description">
        <meta content="" name="keywords">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="telephone=no" name="format-detection">
        <meta name="HandheldFriendly" content="true">
        <meta name="theme-color" content="#ffffff">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=block" rel="stylesheet">
        <link href="static/css/main.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>
        <!-- ------------------------------ TEMPLATE DEFAULT -------------------------------->
        <div class="w-root">
            <div class="w-page">
                <!-- ---------------  Top part page ----------------->
                <!-- begin header-->
                <header class="c-header">
                    <div class="c-header__inner">
                        <div class="c-header__cell">
                            <!-- begin logo-->
                            <a class="c-logo" href="#">
                                <img src="static/img/general/logo.svg" alt="Astro" width="90" height="20">
                            </a>
                            <!-- end logo-->
                        </div>
                    </div>
                </header>
                <!-- end header-->
                <!-- ---------------  Content part page ----------------->
                <div class="w-page__content">
                    <!-- begin container-->
                    <main class="c-container">
                        <div class="w-centered w-column-gap-md">
                            <!-- begin title-->
                            <h1 class="c-title u-text-center">Select your gender</h1>
                            <!-- end title-->
                            <div class="row row--justify-center row--gap-sm">
                                <!-- begin option-card-->
                                <button class="c-option-card" type="button">
                                    <img class="c-image" src="static/img/general/male.png" alt="" width="155" height="210" /><span class="c-option-card__label">Male
                        <svg class="c-ico c-ico--xl c-ico--accent" viewBox="0 0 24 24"><!-- ico name: chevron-right-->
                          <path fill="currentColor" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path>
                        </svg></span>
                                </button>
                                <!-- end option-card-->
                                <!-- begin option-card-->
                                <button class="c-option-card" type="button">
                                    <img class="c-image" src="static/img/general/female.png" alt="" width="155" height="210" /><span class="c-option-card__label">Female
                        <svg class="c-ico c-ico--xl c-ico--accent" viewBox="0 0 24 24"><!-- ico name: chevron-right-->
                          <path fill="currentColor" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path>
                        </svg></span>
                                </button>
                                <!-- end option-card-->
                            </div>
                        </div>
                    </main>
                    <!-- end container-->
                </div>
            </div>
        </div>
        <!-- --------------- Outside part page ----------------->
        <!-- Including js files-->


        <script src="static/js/separate-js/jquery-3.7.1.min.js"></script>
        <script src="static/js/separate-js/bootstrap.bundle.min.js"></script>
        <script src="static/js/separate-js/main.js"></script>
        <script src="static/js/separate-js/animations.js"></script>
    </body>

</html>
