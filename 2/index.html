    <body>
        <!-- ------------------------------ TEMPLATE DEFAULT -------------------------------->
        <div class="w-root">

                <!-- begin header-->
                <header class="c-header">
                    <div class="c-header__inner">
                        <div class="c-header__cell">
                            <button class="c-icon-button c-header__back" type="button" aria-label="Back">
                                <svg class="c-ico c-ico--3xl c-ico--accent" viewBox="0 0 24 24">
                                    <!-- ico name: chevron-left-->
                                    <path fill="currentColor" d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="c-header__cell">
                            <!-- begin logo-->
                            <a class="c-logo" href="#">

                            </a>
                            <!-- end logo-->
                        </div>
                    </div>
                    <!-- begin progress-line-->
                    <div class="c-progress-line">
                        <div class="c-progress-line__fill" role="progressbar" style="width: 32%" aria-valuenow="32" aria-valuemin="0" aria-valuemax="100"></div>

                                    <div class="c-anim-sketch__hand">

                                        <img src="static/img/general/hand.webp" alt="" width="444" height="444" />
                                    </div>
                                </div>

                            </div>
