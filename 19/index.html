<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Astro</title>
        <meta content="" name="description">
        <meta content="" name="keywords">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="telephone=no" name="format-detection">
        <meta name="HandheldFriendly" content="true">
        <meta name="theme-color" content="#ffffff">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=block" rel="stylesheet">
        <link href="static/css/main.min.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>
        <!-- ------------------------------ TEMPLATE DEFAULT -------------------------------->
        <div class="w-root">
            <div class="w-page">
                <!-- ---------------  Top part page ----------------->
                <!-- begin header-->
                <header class="c-header">
                    <div class="c-header__inner">
                        <div class="c-header__cell">
                            <button class="c-icon-button c-header__back" type="button" aria-label="Back">
                                <svg class="c-ico c-ico--3xl c-ico--accent" viewBox="0 0 24 24">
                                    <!-- ico name: chevron-left-->
                                    <path fill="currentColor" d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="c-header__cell">
                            <!-- begin logo-->
                            <a class="c-logo" href="#">
                                <img src="static/img/general/logo.svg" alt="Astro" width="90" height="20">
                            </a>
                            <!-- end logo-->
                        </div>
                    </div>
                </header>
                <!-- end header-->
                <!-- ---------------  Content part page ----------------->
                <div class="w-page__content">
                    <!-- begin container-->
                    <main class="c-container">
                        <div class="w-centered w-column-gap-md">
                            <!-- begin rounded-box-->
                            <div class="c-rounded-box">
                                <!-- begin anim-heart-->
                                <div class="c-anim-heart">
                                    <img src="static/img/general/heart-hug.webp" alt="" width="444" height="444" />
                                </div>
                                <!-- end anim-heart-->
                            </div>
                            <!-- end rounded-box-->
                            <div class="w-column-gap-xs u-text-center">
                                <!-- begin title-->
                                <h1 class="c-title">So many share this challenge</h1>
                                <!-- end title-->
                                <p class="u-mt-0">Many struggle to identify what they truly need. Let us help you discover and honor your deepest desires.</p>
                            </div>
                            <button class="c-btn" type="button">Continue
                            </button>
                        </div>
                    </main>
                    <!-- end container-->
                </div>
            </div>
        </div>
        <!-- --------------- Outside part page ----------------->
        <!-- begin drawer-->
        <nav class="c-drawer js-drawer"><span class="c-drawer__backdrop js-drawer-toggler"></span>
            <div class="c-drawer__dialog">
                <div class="c-drawer__head">
                    <div class="c-drawer__title">Menu</div>
                    <button class="c-icon-button c-drawer__close js-drawer-toggler" type="button" aria-label="Close">
                        <svg class="c-ico c-ico--xl c-ico--accent" viewBox="0 0 24 24">
                            <!-- ico name: close-->
                            <path fill="currentColor" d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path>
                        </svg>
                    </button>
                </div>
                <ul class="c-drawer__menu">
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">Privacy policy</a>
                    </li>
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">Terms & conditions</a>
                    </li>
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">Payment terms</a>
                    </li>
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">Subscription terms</a>
                    </li>
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">Money back policy</a>
                    </li>
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">FAQ</a>
                    </li>
                    <li class="c-drawer__item">
                        <a class="c-drawer__link" href="#">Contact us</a>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- end drawer-->
        <!-- Including js files-->


        <script src="static/js/separate-js/jquery-3.7.1.min.js"></script>
        <script src="static/js/separate-js/bootstrap.bundle.min.js"></script>
        <script src="static/js/separate-js/main.js"></script>
        <script src="static/js/separate-js/animations.js"></script>
        <script>
            animHeart.initialize();
        </script>
    </body>

</html>
