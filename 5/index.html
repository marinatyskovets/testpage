<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Astro</title>
        <meta content="" name="description">
        <meta content="" name="keywords">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="telephone=no" name="format-detection">
        <meta name="HandheldFriendly" content="true">
        <meta name="theme-color" content="#ffffff">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=block" rel="stylesheet">
        <link href="static/css/main.min.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>
        <!-- ------------------------------ TEMPLATE DEFAULT -------------------------------->
        <div class="w-root">
            <div class="w-page">
                <!-- ---------------  Top part page ----------------->
                <!-- begin header-->
                <header class="c-header">
                    <div class="c-header__inner">
                        <div class="c-header__cell">
                            <!-- begin logo-->
                            <a class="c-logo" href="#">
                                <img src="static/img/general/logo.svg" alt="Astro" width="90" height="20">
                            </a>
                            <!-- end logo-->
                        </div>
                    </div>
                </header>
                <!-- end header-->
                <!-- ---------------  Content part page ----------------->
                <div class="w-page__content">
                    <!-- begin container-->
                    <main class="c-container">
                        <div class="w-centered w-column-gap-md">
                            <div class="u-text-center">
                                <!-- begin title-->
                                <h1 class="c-title">Your soulmate portrait is ready!</h1>
                                <!-- end title-->
                            </div>
                        </div>
                    </main>
                    <!-- end container-->
                </div>
            </div>
        </div>
        <!-- --------------- Outside part page ----------------->
        <!-- begin modal-common-->
        <div class="c-modal-common modal fade js-modal-locker c-modal-common--bottom-adaptive show" id="email" style="display: block;">
            <div class="c-modal-common__dialog modal-dialog">
                <div class="c-modal-common__content">
                    <div class="w-column-gap-md">
                        <!-- begin title-->
                        <h2 class="c-title"><span class="u-text-highlight">See your soulmate now!</span><br>Where should we send it?</h2>
                        <!-- end title-->
                        <form class="w-column-gap-sm">
                            <!-- begin form-group-->
                            <div class="form-group">
                                <!-- begin control-label-->
                                <label class="control-label" for="email-field">Email *</label>
                                <!-- end control-label-->
                                <!-- begin form-control-->
                                <input class="form-control" type="email" id="email-field" name="email" placeholder="name@example.com" required="required" />
                                <!-- end form-control-->
                            </div>
                            <!-- end form-group-->
                            <button class="c-btn" type="submit" disabled="disabled">Reveal My Portrait
                            </button>
                            <!-- begin form-group-->
                            <div class="form-group">
                                <!-- begin check-group-->
                                <input type="hidden" />
                                <div class="c-check-group u-text-sm">
                                    <label>
                                        <input type="checkbox" name="terms" /><span>I accept the <a href="#" class="c-link c-link--primary c-link--underline">Terms & Conditions</a> and <a href="#" class="c-link c-link--primary c-link--underline">Privacy Notice</a></span>
                                    </label>
                                </div>
                                <!-- end check-group-->
                            </div>
                            <!-- end form-group-->
                        </form>
                        <!-- begin summary-->
                        <div class="c-summary">
                            <div class="c-summary__item">
                                <div class="c-summary__icon">
                                    <svg class="c-ico c-ico--xl" viewBox="0 0 24 24">
                                        <!-- ico name: gender-female-->
                                        <path fill="currentColor" d="M12,4A6,6 0 0,1 18,10C18,12.97 15.84,15.44 13,15.92V18H15V20H13V22H11V20H9V18H11V15.92C8.16,15.44 6,12.97 6,10A6,6 0 0,1 12,4M12,6A4,4 0 0,0 8,10A4,4 0 0,0 12,14A4,4 0 0,0 16,10A4,4 0 0,0 12,6Z"></path>
                                    </svg>
                                </div>
                                <div class="c-summary__label">Gender</div>
                                <div class="c-summary__value">Female</div>
                            </div>
                            <div class="c-summary__item">
                                <div class="c-summary__icon">
                                    <svg class="c-ico c-ico--xl" viewBox="0 0 24 24">
                                        <!-- ico name: cake-variant-outline-->
                                        <path fill="currentColor" d="M12 6C13.11 6 14 5.1 14 4C14 3.62 13.9 3.27 13.71 2.97L12 0L10.29 2.97C10.1 3.27 10 3.62 10 4C10 5.1 10.9 6 12 6M18 9H13V7H11V9H6C4.34 9 3 10.34 3 12V21C3 21.55 3.45 22 4 22H20C20.55 22 21 21.55 21 21V12C21 10.34 19.66 9 18 9M19 20H5V17C5.9 17 6.76 16.63 7.4 16L8.5 14.92L9.56 16C10.87 17.3 13.15 17.29 14.45 16L15.53 14.92L16.6 16C17.24 16.63 18.1 17 19 17V20M19 15.5C18.5 15.5 18 15.3 17.65 14.93L15.5 12.8L13.38 14.93C12.64 15.67 11.35 15.67 10.61 14.93L8.5 12.8L6.34 14.93C6 15.29 5.5 15.5 5 15.5V12C5 11.45 5.45 11 6 11H18C18.55 11 19 11.45 19 12V15.5Z"></path>
                                    </svg>
                                </div>
                                <div class="c-summary__label">Age</div>
                                <div class="c-summary__value">30-40</div>
                            </div>
                            <div class="c-summary__item">
                                <div class="c-summary__icon">
                                    <svg class="c-ico c-ico--xl" viewBox="0 0 24 24">
                                        <!-- ico name: earth-->
                                        <path fill="currentColor" d="M17.9,17.39C17.64,16.59 16.89,16 16,16H15V13A1,1 0 0,0 14,12H8V10H10A1,1 0 0,0 11,9V7H13A2,2 0 0,0 15,5V4.59C17.93,5.77 20,8.64 20,12C20,14.08 19.2,15.97 17.9,17.39M11,19.93C7.05,19.44 4,16.08 4,12C4,11.38 4.08,10.78 4.21,10.21L9,15V16A2,2 0 0,0 11,18M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"></path>
                                    </svg>
                                </div>
                                <div class="c-summary__label">Ethnicity</div>
                                <div class="c-summary__value">Latino</div>
                            </div>
                        </div>
                        <!-- end summary-->
                        <!-- begin note-->
                        <div class="c-note c-note--top">
                            <svg class="c-ico c-ico--xl c-ico--success" viewBox="0 0 24 24">
                                <!-- ico name: shield-check-outline-->
                                <path fill="currentColor" d="M21,11C21,16.55 17.16,21.74 12,23C6.84,21.74 3,16.55 3,11V5L12,1L21,5V11M12,21C15.75,20 19,15.54 19,11.22V6.3L12,3.18L5,6.3V11.22C5,15.54 8.25,20 12,21M10,17L6,13L7.41,11.59L10,14.17L16.59,7.58L18,9"></path>
                            </svg>
                            <p class="c-note__text">Your privacy is protected - we don’t store or share your data.</p>
                        </div>
                        <!-- end note-->
                    </div>
                </div>
            </div>
        </div>
        <!-- end modal-common-->
        <!-- Including js files-->


        <script src="static/js/separate-js/jquery-3.7.1.min.js"></script>
        <script src="static/js/separate-js/bootstrap.bundle.min.js"></script>
        <script src="static/js/separate-js/main.js"></script>
        <script src="static/js/separate-js/animations.js"></script>
    </body>

</html>
