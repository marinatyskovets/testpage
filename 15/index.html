<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Astro</title>
        <meta content="" name="description">
        <meta content="" name="keywords">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="telephone=no" name="format-detection">
        <meta name="HandheldFriendly" content="true">
        <meta name="theme-color" content="#ffffff">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=block" rel="stylesheet">
        <link href="static/css/main.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>
        <!-- ------------------------------ TEMPLATE DEFAULT -------------------------------->
        <div class="w-root">
            <div class="w-page">
                <!-- ---------------  Top part page ----------------->
                <!-- begin header-->
                <header class="c-header">
                    <div class="c-header__inner">
                        <div class="c-header__cell">
                            <!-- begin logo-->
                            <a class="c-logo" href="#">
                                <img src="static/img/general/logo.svg" alt="Astro" width="90" height="20">
                            </a>
                            <!-- end logo-->
                        </div>
                    </div>
                </header>
                <!-- end header-->
                <!-- ---------------  Content part page ----------------->
                <div class="w-page__content">
                    <!-- begin container-->
                    <main class="c-container">
                        <div class="w-centered w-column-gap-md">
                            <!-- begin title-->
                            <h1 class="c-title u-text-center">Preparing Your Personal Soulmate Insights</h1>
                            <!-- end title-->
                            <!-- begin progress-card-->
                            <div class="c-progress-card">
                                <div class="c-progress-card__item">
                                    <div class="c-progress-card__meta">
                                        <div class="c-progress-card__label">Heart’s intentions</div>
                                        <div class="c-progress-card__value">100%</div>
                                    </div>
                                    <!-- begin progress-line-->
                                    <div class="c-progress-line c-progress-line--md">
                                        <div class="c-progress-line__fill" role="progressbar" style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                    <!-- end progress-line-->
                                </div>
                                <div class="c-progress-card__item">
                                    <div class="c-progress-card__meta">
                                        <div class="c-progress-card__label">Portrait of the soulmate</div>
                                        <div class="c-progress-card__value">64%</div>
                                    </div>
                                    <!-- begin progress-line-->
                                    <div class="c-progress-line c-progress-line--md">
                                        <div class="c-progress-line__fill" role="progressbar" style="width: 64%" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                    <!-- end progress-line-->
                                </div>
                                <div class="c-progress-card__item">
                                    <div class="c-progress-card__meta">
                                        <div class="c-progress-card__label">Connection insights</div>
                                        <div class="c-progress-card__value">0%</div>
                                    </div>
                                    <!-- begin progress-line-->
                                    <div class="c-progress-line c-progress-line--md">
                                        <div class="c-progress-line__fill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                    <!-- end progress-line-->
                                </div>
                            </div>
                            <!-- end progress-card-->
                        </div>
                    </main>
                    <!-- end container-->
                </div>
            </div>
        </div>
        <!-- --------------- Outside part page ----------------->
        <!-- Including js files-->


        <script src="static/js/separate-js/jquery-3.7.1.min.js"></script>
        <script src="static/js/separate-js/bootstrap.bundle.min.js"></script>
        <script src="static/js/separate-js/main.js"></script>
        <script src="static/js/separate-js/animations.js"></script>
    </body>

</html>
